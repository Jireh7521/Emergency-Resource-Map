server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback — any path that isn't a real file goes to index.html
    # so client-side routing (if added later) works on page refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
